name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Go 版本只在这里维护一处（原先 19 个 job 各自内联，升版本要改 19 行）。
# 实际编译用的工具链由各模块 go.mod 的 toolchain 指令决定（GOTOOLCHAIN=auto
# 会自升），这里对齐同一版本只是为了省掉每个 job 一次工具链下载。
env:
  GO_VERSION: '1.27.0'

jobs:
  # 全业务公开不再禁服务名/schema；内部资料、密钥和公开 SQL 历史身份仍须逐项拒绝。
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Public content boundary
        run: bash scripts/verify-product.sh public-hygiene
      - name: Immutable public migration history
        run: bash scripts/verify-product.sh public-migrations

  go-mod-cache:
    name: Go Module Cache Warm-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - name: Download all Go modules (shared cache for service jobs)
        working-directory: microservices/services
        run: go mod download

  workspace:
    name: Micro Workspace
    runs-on: ubuntu-latest
    needs: go-mod-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum

      - name: Product release tools
        run: bash scripts/verify-product.sh release-tools

      - name: Workspace scripts
        working-directory: microservices
        run: |
          npm run api:contract
          npm run test:contract
          npm run test:compose:config
          npm run test:smoke:unit

      - name: Check generated OpenAPI is committed
        run: git diff --exit-code -- microservices/services/monitor/docs/openapi.json

  proto-breaking:
    name: Proto Breaking Change Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.54.0"
      - name: Check for breaking changes
        working-directory: microservices/services/api/proto
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            buf breaking --against '.git#branch=${{ github.base_ref }}'
          else
            buf breaking --against '.git#branch=main'
          fi

  # shared 是 16 个服务共用的公共库（metrics/logger/response/jobbeat/mask/iploc），必须单独门禁
  shared-module:
    needs: go-mod-cache
    name: Shared Module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/shared
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  monitor-service:
    needs: go-mod-cache
    name: Monitor Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/monitor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum

      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Summarize Go coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Monitor service coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --config ../../../.golangci.yml ./...

  auth-service:
    needs: go-mod-cache
    name: Auth Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  identity-service:
    needs: go-mod-cache
    name: Identity Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/identity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  system-service:
    needs: go-mod-cache
    name: System Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/system
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: microservices/web/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci
        working-directory: microservices/web
      - run: npm run test:codegen:contract
        working-directory: microservices

  audit-service:
    needs: go-mod-cache
    name: Audit Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  file-service:
    needs: go-mod-cache
    name: File Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/file
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  ai-service:
    needs: go-mod-cache
    name: AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...


  im-service:
    needs: go-mod-cache
    name: IM Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/im
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  cc-service:
    needs: go-mod-cache
    name: CC Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/cc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  crm-service:
    needs: go-mod-cache
    name: CRM Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  visibility-service:
    needs: go-mod-cache
    name: Visibility Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/visibility
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  mp-service:
    needs: go-mod-cache
    name: MP Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/mp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  bpm-service:
    needs: go-mod-cache
    name: BPM Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/bpm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  notify-service:
    needs: go-mod-cache
    name: Notify Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/notify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  pay-service:
    needs: go-mod-cache
    name: Pay Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/pay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  ticket-service:
    needs: go-mod-cache
    name: Ticket Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services/ticket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum
      - run: go test ./...
      - run: go vet ./...

  micro-frontend:
    name: Micro Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: microservices/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:i18n
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:components
      - run: npm run test:demo
      - run: node --test ../tests/monitoring-config.test.mjs

  integration:
    name: Micro Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - go-mod-cache
      - workspace
      - monitor-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: docker/setup-buildx-action@v4

      - name: Build compose images
        uses: docker/bake-action@v7
        with:
          source: microservices
          files: docker-compose.yml
          load: true
          provenance: false
          set: |
            monitor-service.tags=go-admin-kit-monitor-service:latest
            monitor-service.cache-from=type=gha,scope=compose-monitor
            monitor-service.cache-to=type=gha,scope=compose-monitor,mode=max,ignore-error=true
            auth-service.tags=go-admin-kit-auth-service:latest
            auth-service.cache-from=type=gha,scope=compose-auth
            auth-service.cache-to=type=gha,scope=compose-auth,mode=max,ignore-error=true
            identity-service.tags=go-admin-kit-identity-service:latest
            identity-service.cache-from=type=gha,scope=compose-identity
            identity-service.cache-to=type=gha,scope=compose-identity,mode=max,ignore-error=true
            system-service.tags=go-admin-kit-system-service:latest
            system-service.cache-from=type=gha,scope=compose-system
            system-service.cache-to=type=gha,scope=compose-system,mode=max,ignore-error=true
            audit-service.tags=go-admin-kit-audit-service:latest
            audit-service.cache-from=type=gha,scope=compose-audit
            audit-service.cache-to=type=gha,scope=compose-audit,mode=max,ignore-error=true
            file-service.tags=go-admin-kit-file-service:latest
            file-service.cache-from=type=gha,scope=compose-file
            file-service.cache-to=type=gha,scope=compose-file,mode=max,ignore-error=true
            frontend.tags=go-admin-kit-frontend:latest
            frontend.cache-from=type=gha,scope=compose-frontend
            frontend.cache-to=type=gha,scope=compose-frontend,mode=max,ignore-error=true

      - name: Start postgres, redis and NATS
        working-directory: microservices
        run: |
          docker network inspect go-admin-kit-net >/dev/null 2>&1 || \
            docker network create --subnet 172.28.0.0/16 go-admin-kit-net
          docker compose -p go-admin-kit-infra -f docker-compose.infra.yml up -d --wait --wait-timeout 180 go-admin-kit-postgres go-admin-kit-redis go-admin-kit-nats

      - name: Apply migrations and seed data
        working-directory: microservices/services/monitor
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: '123456'
          DB_NAME: go_admin_kit
          DB_SSLMODE: disable
        run: |
          rehearsal_args=()
          # The public snapshot carries an explicit forward-only migration map.
          if [[ -f ./migrations/release-map.json ]]; then rehearsal_args+=(-forward-only); fi
          go run ./cmd/migration-rehearsal -config ./configs/config.yaml -dir ./migrations -database go_admin_kit_ci_migration_rehearsal "${rehearsal_args[@]}"
          go run ./cmd/migrate -config ./configs/config.yaml -dir ./migrations up

      - name: Start the full stack behind the Traefik gateway
        working-directory: microservices
        run: docker compose --profile compose-fallback up -d --wait --wait-timeout 300

      - name: Run API smoke through the gateway
        working-directory: microservices
        env:
          API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          npm run test:smoke:unit
          npm run smoke:api

      - name: Dump compose state and logs
        if: failure()
        working-directory: microservices
        run: |
          docker compose ps -a || true
          docker compose logs --tail=500 || true
          echo '::group::file-service full log (diagnose upload 500)'
          docker compose logs --no-log-prefix --tail=300 file-service || true
          echo '::endgroup::'
          echo '::group::gateway (Traefik) log incl. access log'
          docker compose logs --no-log-prefix --tail=300 gateway || true
          echo '::endgroup::'

      - name: Tear down the stack
        if: always()
        working-directory: microservices
        run: |
          docker compose --profile compose-fallback down -v --remove-orphans

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: microservices/services/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: microservices/web/package-lock.json

      - uses: docker/setup-buildx-action@v4

      - name: Build compose images
        uses: docker/bake-action@v7
        with:
          source: microservices
          files: docker-compose.yml
          load: true
          provenance: false
          set: |
            monitor-service.tags=go-admin-kit-monitor-service:latest
            auth-service.tags=go-admin-kit-auth-service:latest
            identity-service.tags=go-admin-kit-identity-service:latest
            system-service.tags=go-admin-kit-system-service:latest
            audit-service.tags=go-admin-kit-audit-service:latest
            file-service.tags=go-admin-kit-file-service:latest
            frontend.tags=go-admin-kit-frontend:latest

      - name: Start infra and stack
        working-directory: microservices
        run: |
          docker network inspect go-admin-kit-net >/dev/null 2>&1 || \
            docker network create --subnet 172.28.0.0/16 go-admin-kit-net
          docker compose -p go-admin-kit-infra -f docker-compose.infra.yml up -d --wait --wait-timeout 180 go-admin-kit-postgres go-admin-kit-redis go-admin-kit-nats
          go run ./services/monitor/cmd/migrate -config ./services/monitor/configs/config.yaml -dir ./services/monitor/migrations up
          docker compose --profile compose-fallback up -d --wait --wait-timeout 300

      - name: Install Playwright
        working-directory: microservices/web
        run: |
          npm ci
          npm run test:e2e:install

      - name: Run Playwright E2E through the gateway
        working-directory: microservices/web
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: microservices/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: microservices
        run: |
          docker compose --profile compose-fallback down -v --remove-orphans
          docker compose -p go-admin-kit-infra down -v --remove-orphans
          docker compose -p go-admin-kit-infra -f docker-compose.infra.yml down -v --remove-orphans
