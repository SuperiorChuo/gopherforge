# 依赖自动升级。
#
# 约定：
# - Go 模块按真实 go.mod 声明；services 是统一模块，附属工具与客户端各自独立。
#   workspace 不会自动展开，新增独立模块时同步更新本清单。
# - 全部 weekly + open-pull-requests-limit，避免 PR 淹没；minor/patch 合并成一个
#   分组 PR，major 单独开（需要人工看破坏性变更）。
# - 时间刻意错开整点，别和全球所有仓库的 Dependabot 撞在同一分钟。
version: 2

updates:
  # ---------- Go modules（产品服务、工具、媒体控制与客户端）----------
  - package-ecosystem: gomod
    directories:
      - /microservices/services
      - /microservices/tools/dbdoc
      - /freeswitch-cc/control-api
      - /clients/hermes-manager
    schedule:
      interval: weekly
      day: monday
      time: "04:13"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 构建
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------- 前端 npm（唯一有 lockfile 的前端工程）----------
  - package-ecosystem: npm
    directory: /microservices/web
    schedule:
      interval: weekly
      day: monday
      time: "04:37"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 构建
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------- GitHub Actions（.github/workflows 全部 workflow）----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:07"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 构建（CI）
    groups:
      actions-all:
        patterns:
          - "*"

  # ---------- 容器基础镜像 ----------
  # 这条是给 trivy 镜像扫描配套的：基础镜像 CVE 只能靠升 base image 修。
  # 刻意忽略 major（golang / node / nginx 跨大版本要人工决策，不该自动开 PR）。
  # 嫌吵就整条删掉，不影响其它三个生态。
  - package-ecosystem: docker
    directories:
      - /microservices/services/ai
      - /microservices/services/audit
      - /microservices/services/auth
      - /microservices/services/bpm
      - /microservices/services/cc
      - /microservices/services/crm
      - /microservices/services/file
      - /microservices/services/identity
      - /microservices/services/im
      - /microservices/services/monitor
      - /microservices/services/mp
      - /microservices/services/notify
      - /microservices/services/pay
      - /microservices/services/system
      - /microservices/services/ticket
      - /microservices/services/visibility
      - /microservices/web
    schedule:
      interval: weekly
      day: tuesday
      time: "04:23"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: 构建（镜像）
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      base-images:
        patterns:
          - "*"
