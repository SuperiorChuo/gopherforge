version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    misspell:
      locale: US
      # ops_task_runs 的 cancelled 状态值是 DB/API 契约（列名/JSON key/状态字面量），
      # 字段标识符已用美式 Canceled，契约字符串保持 cancelled 不改，此处放行。
      ignore-rules:
        - cancelled
  exclusions:
    # paths 是 Go 正则而非 glob，`**` 会直接让 lint 报配置错误退出
    paths:
      - '(^|/)logs($|/)'
      - '(^|/)node_modules($|/)'
      - '(^|/)dist($|/)'
