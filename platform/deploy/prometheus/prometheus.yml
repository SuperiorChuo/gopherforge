# Default for Compose. For Swarm replicas select prometheus.swarm.yml using
# PROMETHEUS_CONFIG_FILE in microservices/.env (see README.md in this directory).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["go-admin-kit-alertmanager:9093"]

scrape_configs:
  - job_name: postgres
    scrape_interval: 60s
    static_configs:
      - targets: ["go-admin-kit-postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["go-admin-kit-redis-exporter:9121"]
  - job_name: node
    static_configs:
      - targets: ["go-admin-kit-node-exporter:9100"]
  - job_name: traefik
    static_configs:
      - targets: ["go-admin-kit-gateway:8080"]
  - job_name: go-admin-kit-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["go-admin-kit-monitor:8081"]

  # Compose service/container names, not Swarm task DNS. Keep service labels
  # stable for the existing public dashboards and alert rules.
  - job_name: go-admin-kit-services
    metrics_path: /metrics
    static_configs:
      - targets: ["go-admin-kit-auth:8082"]
        labels: { service: auth }
      - targets: ["go-admin-kit-identity:8083"]
        labels: { service: identity }
      - targets: ["go-admin-kit-system:8084"]
        labels: { service: system }
      - targets: ["go-admin-kit-audit:8085"]
        labels: { service: audit }
      - targets: ["go-admin-kit-file:8086"]
        labels: { service: file }
      - targets: ["go-admin-kit-ai:8087"]
        labels: { service: ai }
      - targets: ["go-admin-kit-im:8088"]
        labels: { service: im }
      - targets: ["go-admin-kit-cc:8089"]
        labels: { service: cc }
      - targets: ["go-admin-kit-crm:8091"]
        labels: { service: crm }
      - targets: ["go-admin-kit-mp:8092"]
        labels: { service: mp }
      - targets: ["go-admin-kit-visibility:8093"]
        labels: { service: visibility }
      - targets: ["go-admin-kit-ticket:8094"]
        labels: { service: ticket }
      - targets: ["go-admin-kit-notify:8095"]
        labels: { service: notify }
      - targets: ["go-admin-kit-bpm:8096"]
        labels: { service: bpm }
      - targets: ["go-admin-kit-pay:8097"]
        labels: { service: pay }

  # Optional FreeSWITCH control-api lives in a separate deployment. Add an
  # fscc-control-api job with your reachable endpoint only when it is deployed.
