# 运维告警规则（告警闭环②）：触发 → Alertmanager 分组去抖 → notify webhook 站内信。
# 阈值按内网单机开发环境定，生产按量调。severity: critical=影响服务, warning=需关注。
groups:
  - name: availability
    rules:
      # 任何抓取目标掉线（业务服务副本 / monitor / fscc control-api / node）。
      # Swarm 滚动更新期间副本短暂消失属正常，for 3m 吸收。
      - alert: ServiceDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "监控目标掉线：{{ $labels.job }}/{{ $labels.service }}{{ $labels.instance }}"
          description: "Prometheus 连续 3 分钟抓不到该目标，服务可能已宕或网络不通。"

      # FreeSWITCH ESL 采集断链：呼叫中心事件/话单链路的根依赖。
      - alert: FsccEslDown
        expr: fscc_esl_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "FreeSWITCH ESL 连接断开"
          description: "control-api 连续 5 分钟无法从 FS 采集，呼叫事件与话单可能丢失。"

  - name: host
    rules:
      # 磁盘可用低于 15%：录音/备份最容易吃满盘。
      - alert: HostDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} /
           node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "磁盘空间不足：{{ $labels.mountpoint }} 剩 {{ $value | humanizePercentage }}"
          description: "先查录音盘与备份目录（disk-cleanup/pg-backup 保留期），必要时扩容。"

      # 内存持续高位（>92% 十分钟）。
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机内存高位：已用 {{ $value | humanizePercentage }}"
          description: "持续 10 分钟高于 92%，检查异常容器（docker stats）。"

  - name: errors
    rules:
      # 某服务 5 分钟内 5xx/框架错误超 30 次（shared/pkg/metrics 计数器）。
      - alert: ServiceHighErrorRate
        expr: increase(go_admin_kit_http_request_errors_total[5m]) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "服务错误陡增：{{ $labels.service }} 5 分钟内 {{ $value | printf \"%.0f\" }} 个 5xx"
          description: "查该服务容器日志与 Grafana 服务概览（错误率/P95）。"

      # PostgreSQL 连接数接近上限（max_connections=300，>80% 持续 3m 告警）
      - alert: PostgresHighConnections
        expr: (sum(pg_stat_database_numbackends) by (instance) / 300) > 0.8
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "PG 连接数 {{ $value | humanizePercentage }}"
          description: "{{ $labels.instance }} 当前 {{- range query \"sum(pg_stat_database_numbackends)\" }}{{ . | value }}{{ end }} 个活跃连接，接近上限 300"

      # PostgreSQL 不可达
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL 不可达"
          description: "pg_up=0，持续 1 分钟"

      # 死锁（最近 5 分钟内）
      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "PG 检测到死锁"
          description: "最近 5 分钟发生死锁，速率 {{ $value }}"

      # 慢查询（单条 >5s，5 分钟内 >10 条）
      - alert: PostgresSlowQueries
        expr: rate(pg_stat_statements_mean_exec_time_seconds[5m]) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PG 慢查询均值 >5s"
          description: "pg_stat_statements 平均执行时间 {{ $value }}s"

      # 证书过期（<30 天）
      - alert: CertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 30 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "证书将在 {{ $value | humanizeDuration }} 后过期"
          description: "域名 {{ $labels.instance }} 的 SSL 证书即将过期，需续签"
