# NATS 配置：JetStream 存储硬上限。
#
# 为什么用配置文件而不是 command flag：nats-server 2.10 的 CLI 只认
# --jetstream / --store_dir，max_file_store 与 max_memory_store 没有对应
# 的命令行开关（传了会 "flag provided but not defined" 直接启动失败）。
# 这两个上限只能经配置文件的 jetstream 块下发。
#
# 上限依据：JetStream 默认可占用可用磁盘的 75%，与数据库备份等同盘写入
# 竞争时磁盘写满是头号风险，故设硬上限。

http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 2GB
  max_memory_store: 256MB
}
