<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>在线客服</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #0f172a; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #f8fafc; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      font-weight: 600; font-size: 15px;
    }
    header button {
      border: 0; background: rgba(255,255,255,.18); color: #fff;
      width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 16px;
    }
    #log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
    .them { align-self: flex-start; background: #e2e8f0; border-bottom-left-radius: 4px; }
    .bot { align-self: flex-start; background: #ede9fe; border-bottom-left-radius: 4px; }
    .sys { align-self: center; color: #64748b; font-size: 12px; background: transparent; }
    form#f { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e2e8f0; background: #fff; }
    form#f input { flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    button.send { border: 0; background: #4f46e5; color: #fff; border-radius: 10px; padding: 0 14px; cursor: pointer; font-weight: 600; }
    #meta { font-size: 11px; color: #94a3b8; padding: 0 12px 8px; }
    #contact {
      display: none; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; background: #fff;
      gap: 8px; flex-wrap: wrap; align-items: center;
    }
    #contact.is-open { display: flex; }
    #contact input {
      flex: 1; min-width: 100px; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 7px 10px; font-size: 13px;
    }
    #contact button {
      border: 0; background: #4f46e5; color: #fff; border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
    }
    #contact .tip { width: 100%; font-size: 11px; color: #64748b; margin: 0; }
    #contact-toggle {
      border: 0; background: transparent; color: #4f46e5; font-size: 12px;
      cursor: pointer; padding: 0 12px 6px; text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <span id="title">在线客服</span>
    <span style="display:flex;gap:6px;align-items:center">
      <button type="button" id="human" title="转人工" style="width:auto;padding:0 8px;font-size:12px">转人工</button>
      <button type="button" id="close" title="关闭">×</button>
    </span>
  </header>
  <div id="contact">
    <p class="tip">方便客服回电时，可留下称呼与电话（选填）</p>
    <input id="cname" type="text" placeholder="怎么称呼您" maxlength="32" autocomplete="name" />
    <input id="cphone" type="tel" placeholder="联系电话" maxlength="20" autocomplete="tel" />
    <button type="button" id="csave">保存</button>
  </div>
  <button type="button" id="contact-toggle">📞 留下联系方式</button>
  <div id="log"></div>
  <div id="meta">连接中…</div>
  <form id="f">
    <input id="file" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.mp4,.mp3" style="display:none" />
    <button class="send" type="button" id="attach" title="发送图片/文件" style="background:#e2e8f0;color:#0f172a">📎</button>
    <input id="text" placeholder="输入消息…（可说转人工）" autocomplete="off" />
    <button class="send" type="submit">发送</button>
  </form>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var APP_KEY = params.get('app_key') || 'demo';
      var PARENT_ORIGIN = params.get('parent_origin') || '';
      var API = ''; // same origin as frame (gateway or im-service)
      var logEl = document.getElementById('log');
      var meta = document.getElementById('meta');
      var extraContext = {};
      // Seed page source from query (parent injects on iframe src) then postMessage overrides.
      if (params.get('page_url')) extraContext.page_url = params.get('page_url');
      if (params.get('page_title')) extraContext.page_title = params.get('page_title');
      if (params.get('referrer')) extraContext.referrer = params.get('referrer');
      if (PARENT_ORIGIN) extraContext.parent_origin = PARENT_ORIGIN;

      function add(cls, text) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
        return d;
      }
      function isImageURL(u) { return /\.(jpe?g|png|gif|webp)$/i.test(u || ''); }
      function addRich(cls, content) {
        var o = null;
        try { o = typeof content === 'string' ? JSON.parse(content) : content; } catch (e) { /* plain text */ }
        if (o && o.event === 'recalled') return add('sys', '（对方撤回了一条消息）');
        if (o && o.event === 'offline_notice') return add('sys', o.text || '坐席暂时不在线，欢迎留言');
        if (o && o.event) return add('sys', '[' + o.event + ']');
        if (o && o.url) {
          var d = add(cls, '');
          d.textContent = '';
          if (isImageURL(o.url)) {
            var a = document.createElement('a');
            a.href = o.url; a.target = '_blank'; a.rel = 'noreferrer';
            var img = document.createElement('img');
            img.src = o.url; img.alt = o.name || '图片';
            img.style.cssText = 'max-width:200px;max-height:160px;border-radius:8px;display:block';
            a.appendChild(img); d.appendChild(a);
          } else {
            var link = document.createElement('a');
            link.href = o.url; link.target = '_blank'; link.rel = 'noreferrer';
            link.textContent = '📎 ' + (o.name || '附件');
            d.appendChild(link);
          }
          logEl.scrollTop = logEl.scrollHeight;
          return d;
        }
        return add(cls, (o && o.text) || String(content));
      }

      // —— 已读回执：跟踪自己最后一条消息 + 坐席读游标 ——
      var agentReadSeq = 0, lastMineSeq = 0, lastMineEl = null, readMark = null;
      function noteMine(el, seq) {
        if (el) lastMineEl = el;
        if (seq && seq > lastMineSeq) lastMineSeq = seq;
        updateReadMark();
      }
      function updateReadMark() {
        if (!lastMineEl || !lastMineSeq) return;
        if (agentReadSeq >= lastMineSeq) {
          if (!readMark) {
            readMark = document.createElement('div');
            readMark.style.cssText = 'align-self:flex-end;font-size:11px;color:#94a3b8';
            readMark.textContent = '已读';
          }
          if (readMark !== lastMineEl.nextSibling) logEl.insertBefore(readMark, lastMineEl.nextSibling);
        } else if (readMark && readMark.parentNode) {
          readMark.parentNode.removeChild(readMark);
        }
      }
      function markReadUpTo(seq) {
        if (!convId || !guestToken) return;
        api('/api/v1/im/conversations/' + convId + '/read', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + guestToken },
          body: JSON.stringify({ seq: seq || 0 }),
        }).catch(function () {});
      }

      var guestToken = localStorage.getItem('im_guest_token_' + APP_KEY) || '';
      var guestKey = localStorage.getItem('im_guest_key_' + APP_KEY) || '';
      var convId = '';
      var ws;

      // —— 满意度评价：会话关闭且未评价时展示一次 ——
      var rated = false, ratingEl = null;
      function showRating() {
        if (rated || ratingEl || !convId || !guestToken) return;
        ratingEl = document.createElement('div');
        ratingEl.className = 'msg sys';
        ratingEl.style.cssText = 'background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;align-self:center;text-align:center;max-width:90%';
        var tip = document.createElement('div');
        tip.textContent = '本次服务还满意吗？点亮星星告诉我们';
        tip.style.cssText = 'margin-bottom:6px;color:#334155';
        var stars = document.createElement('div');
        stars.style.cssText = 'font-size:22px;cursor:pointer;letter-spacing:4px;user-select:none';
        var score = 0;
        var comment = document.createElement('input');
        comment.placeholder = '说点什么…（可选）';
        comment.maxLength = 200;
        comment.style.cssText = 'display:none;margin-top:8px;width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px';
        var submit = document.createElement('button');
        submit.type = 'button';
        submit.textContent = '提交评价';
        submit.style.cssText = 'display:none;margin-top:8px;border:0;background:#4f46e5;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer';
        function paint() {
          stars.textContent = '';
          for (var i = 1; i <= 5; i++) {
            (function (v) {
              var s = document.createElement('span');
              s.textContent = v <= score ? '★' : '☆';
              s.style.color = v <= score ? '#f59e0b' : '#cbd5e1';
              s.onclick = function () {
                score = v;
                paint();
                comment.style.display = 'block';
                submit.style.display = 'inline-block';
              };
              stars.appendChild(s);
            })(i);
          }
        }
        submit.onclick = function () {
          if (!score) return;
          api('/api/v1/im/conversations/' + convId + '/rating', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + guestToken },
            body: JSON.stringify({ score: score, comment: comment.value.trim() }),
          }).then(function (r) {
            if (r.code === 200) {
              rated = true;
              ratingEl.textContent = '感谢您的评价 ' + '★★★★★'.slice(0, score);
              ratingEl.style.color = '#f59e0b';
            } else {
              add('sys', (r && r.message) || '评价失败');
            }
          }).catch(function () { add('sys', '评价失败'); });
        };
        paint();
        ratingEl.appendChild(tip);
        ratingEl.appendChild(stars);
        ratingEl.appendChild(comment);
        ratingEl.appendChild(submit);
        logEl.appendChild(ratingEl);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function bubbleClass(sender) {
        if (sender === 'visitor') return 'me';
        if (sender === 'bot') return 'bot';
        if (sender === 'system') return 'sys';
        return 'them';
      }

      document.getElementById('close').onclick = function () {
        if (window.parent) {
          window.parent.postMessage({ type: 'goadmin-im-close' }, PARENT_ORIGIN || '*');
        }
      };

      document.getElementById('human').onclick = function () {
        if (!convId || !guestToken) return;
        api('/api/v1/im/conversations/' + convId + '/transfer_human', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + guestToken },
          body: JSON.stringify({ reason: 'visitor' }),
        }).then(function (r) {
          if (r.code === 200) {
            add('sys', '已请求转人工');
            meta.textContent = '排队中…';
          } else {
            add('sys', r.message || '转人工失败');
          }
        });
      };

      window.addEventListener('message', function (ev) {
        if (PARENT_ORIGIN && ev.origin !== PARENT_ORIGIN) return;
        var data = ev.data || {};
        if (data.type === 'goadmin-im-context') {
          extraContext = Object.assign({}, extraContext, data.context || {});
        }
      });

      // Ask parent for latest page_url / referrer as early as possible.
      if (window.parent) {
        window.parent.postMessage({ type: 'goadmin-im-need-context' }, PARENT_ORIGIN || '*');
      }

      var contactBar = document.getElementById('contact');
      var contactToggle = document.getElementById('contact-toggle');
      contactToggle.onclick = function () {
        var open = contactBar.classList.toggle('is-open');
        contactToggle.textContent = open ? '收起联系方式' : '📞 留下联系方式';
      };

      function setContactSummary(name, phone) {
        if (phone) {
          contactToggle.textContent = '📞 已留电话 ' + phone;
          contactBar.classList.remove('is-open');
        } else if (name && name !== '网站访客') {
          contactToggle.textContent = '📞 ' + name + ' · 补充电话';
        } else {
          contactToggle.textContent = '📞 留下联系方式';
        }
      }

      document.getElementById('csave').onclick = function () {
        if (!guestToken) return;
        var name = (document.getElementById('cname').value || '').trim();
        var phone = (document.getElementById('cphone').value || '').trim();
        if (!name && !phone) {
          add('sys', '请填写称呼或电话');
          return;
        }
        var body = {};
        if (name) body.display_name = name;
        if (phone) body.phone = phone;
        api('/api/v1/im/visitor/profile', {
          method: 'PUT',
          headers: { Authorization: 'Bearer ' + guestToken },
          body: JSON.stringify(body),
        }).then(function (r) {
          if (r.code !== 200) {
            add('sys', (r && r.message) || '保存失败');
            return;
          }
          var v = (r.data && r.data.visitor) || {};
          setContactSummary(v.display_name || name, v.phone || phone);
          add('sys', '联系方式已保存' + (v.phone ? '：' + v.phone : ''));
        }).catch(function () { add('sys', '保存失败'); });
      };

      async function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({
          'Content-Type': 'application/json',
        }, opts.headers || {});
        if (PARENT_ORIGIN) opts.headers['X-Parent-Origin'] = PARENT_ORIGIN;
        var res = await fetch(API + path, opts);
        return res.json();
      }

      function buildPageContext() {
        var pageCtx = {
          channel: 'web_widget',
          page_url: extraContext.page_url || extraContext.page || PARENT_ORIGIN || '',
          page: extraContext.page_url || extraContext.page || PARENT_ORIGIN || '',
          page_title: extraContext.page_title || '',
          referrer: extraContext.referrer || '',
          parent_origin: extraContext.parent_origin || PARENT_ORIGIN || '',
        };
        return Object.assign(pageCtx, extraContext);
      }

      async function boot() {
        var cfg = await api('/api/v1/im/widget/config?app_key=' + encodeURIComponent(APP_KEY) +
          (PARENT_ORIGIN ? '&parent_origin=' + encodeURIComponent(PARENT_ORIGIN) : ''));
        if (cfg.code !== 200) throw new Error(cfg.message || 'config failed');
        document.getElementById('title').textContent = (cfg.data && cfg.data.name) || '在线客服';

        var savedName = localStorage.getItem('im_display_name_' + APP_KEY) || '';
        var sess = await api('/api/v1/im/visitor/session', {
          method: 'POST',
          body: JSON.stringify({
            app_key: APP_KEY,
            guest_key: guestKey || undefined,
            display_name: savedName || '网站访客',
            parent_origin: PARENT_ORIGIN || undefined,
          }),
        });
        if (sess.code !== 200) throw new Error(sess.message || 'session failed');
        guestToken = sess.data.guest_token;
        guestKey = sess.data.guest_key;
        localStorage.setItem('im_guest_token_' + APP_KEY, guestToken);
        localStorage.setItem('im_guest_key_' + APP_KEY, guestKey);
        if (sess.data.welcome_text) add('sys', sess.data.welcome_text);

        if (sess.data.display_name) {
          document.getElementById('cname').value = sess.data.display_name === '网站访客' ? '' : sess.data.display_name;
          localStorage.setItem('im_display_name_' + APP_KEY, sess.data.display_name);
        }
        if (sess.data.phone) {
          document.getElementById('cphone').value = sess.data.phone;
        }
        setContactSummary(sess.data.display_name, sess.data.phone);
        // First-time visitors: expand contact form lightly
        if (!sess.data.phone) {
          contactBar.classList.add('is-open');
          contactToggle.textContent = '收起联系方式';
        }

        var pageCtx = buildPageContext();

        var conv = await api('/api/v1/im/conversations', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + guestToken },
          body: JSON.stringify({ channel: 'web_widget', context: pageCtx }),
        });
        if (conv.code !== 200) throw new Error(conv.message || 'conv failed');
        convId = conv.data.public_id;
        meta.textContent = '会话 ' + convId.slice(0, 8) + '…';
        if (conv.data.status === 'queued' && conv.data.queue_position > 0) {
          add('sys', '正在排队，您前面还有 ' + (conv.data.queue_position - 1) + ' 位');
        }

        var hist = await api('/api/v1/im/conversations/' + convId + '/messages', {
          headers: { Authorization: 'Bearer ' + guestToken },
        });
        if (hist.code === 200) {
          agentReadSeq = (hist.data.conversation && hist.data.conversation.agent_last_read_seq) || 0;
          (hist.data.messages || []).forEach(function (m) {
            var el = addRich(bubbleClass(m.sender_type), m.content);
            if (m.sender_type === 'visitor') noteMine(el, m.seq);
          });
          markReadUpTo(0); // 打开面板即读到最新
          var hc = hist.data.conversation;
          if (hc && hc.status === 'closed' && !hc.rating_score) showRating();
        }

        var wsBase = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
        ws = new WebSocket(wsBase + '/im/ws?token=' + encodeURIComponent(guestToken));
        ws.onopen = function () {
          ws.send(JSON.stringify({ type: 'conversation.subscribe', payload: { conversation_public_id: convId } }));
          meta.textContent = '已连接 · ' + convId.slice(0, 8) + '…';
          if (window.parent) window.parent.postMessage({ type: 'goadmin-im-ready' }, PARENT_ORIGIN || '*');
        };
        ws.onmessage = function (ev) {
          var msg = JSON.parse(ev.data);
          if (msg.type === 'message.new') {
            var m = msg.payload.message;
            if (m.sender_type === 'visitor') return;
            addRich(bubbleClass(m.sender_type), m.content);
            markReadUpTo(m.seq); // 面板开着即已读
          }
          if (msg.type === 'message.ack' && msg.payload && msg.payload.seq) {
            noteMine(null, msg.payload.seq);
          }
          if (msg.type === 'conversation.read' && msg.payload && msg.payload.reader === 'agent') {
            agentReadSeq = Math.max(agentReadSeq, msg.payload.seq || 0);
            updateReadMark();
          }
          if (msg.type === 'message.recalled' && msg.payload && msg.payload.message) {
            add('sys', '（对方撤回了一条消息）');
          }
          if (msg.type === 'conversation.updated' && msg.payload && msg.payload.status) {
            meta.textContent = '会话 ' + convId.slice(0, 8) + '… · ' + msg.payload.status;
            if (msg.payload.status === 'closed' && !msg.payload.rating_score) showRating();
          }
        };
        ws.onclose = function () { meta.textContent = '连接断开，请关闭后重开'; };
      }

      document.getElementById('attach').onclick = function () {
        if (!convId || !guestToken) return;
        document.getElementById('file').click();
      };
      document.getElementById('file').onchange = function () {
        var f = this.files && this.files[0];
        this.value = '';
        if (!f || !convId || !guestToken) return;
        if (f.size > 10 * 1024 * 1024) { add('sys', '文件不能超过 10MB'); return; }
        var fd = new FormData();
        fd.append('file', f);
        fetch(API + '/api/v1/im/attachments', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + guestToken },
          body: fd,
        }).then(function (r) { return r.json(); }).then(function (r) {
          if (r.code !== 200) { add('sys', r.message || '上传失败'); return; }
          var att = r.data;
          var el = addRich('me', { url: att.url, name: att.name });
          noteMine(el, 0);
          api('/api/v1/im/conversations/' + convId + '/messages', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + guestToken },
            body: JSON.stringify({
              client_msg_id: (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()),
              msg_type: att.msg_type,
              content: { url: att.url, name: att.name, size: att.size, mime: att.mime },
            }),
          }).then(function (r2) {
            if (r2.code === 200 && r2.data && r2.data.seq) noteMine(null, r2.data.seq);
          });
        }).catch(function () { add('sys', '上传失败'); });
      };

      document.getElementById('f').onsubmit = function (e) {
        e.preventDefault();
        var input = document.getElementById('text');
        var text = input.value.trim();
        if (!text || !convId) return;
        input.value = '';
        noteMine(add('me', text), 0);
        var client_msg_id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({
            type: 'message.send',
            request_id: client_msg_id,
            payload: {
              conversation_public_id: convId,
              client_msg_id: client_msg_id,
              msg_type: 'text',
              content: { text: text },
            },
          }));
        } else {
          api('/api/v1/im/conversations/' + convId + '/messages', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + guestToken },
            body: JSON.stringify({ client_msg_id: client_msg_id, msg_type: 'text', content: { text: text } }),
          }).then(function (r2) {
            if (r2.code === 200 && r2.data && r2.data.seq) noteMine(null, r2.data.seq);
          });
        }
      };

      boot().catch(function (err) {
        meta.textContent = '启动失败: ' + err.message;
        console.error(err);
      });
    })();
  </script>
</body>
</html>
