# Edge PEM certs → Traefik file provider (optional overlay)
#
# Usage:
#   export EDGE_CERT_HOST_DIR=$PWD/certs/edge
#   export EDGE_TRAEFIK_DYNAMIC_DIR=$PWD/certs/traefik-dynamic
#   mkdir -p "$EDGE_CERT_HOST_DIR" "$EDGE_TRAEFIK_DYNAMIC_DIR"
#   # place edge-tls.yml + domain.crt/domain.key under those dirs
#   docker compose -p go-admin-kit \
#     -f docker-compose.yml \
#     -f docker-compose.gateway-edge-tls.example.yml \
#     up -d --force-recreate gateway
#
# Defaults point at repo-relative paths; override with env for production hosts.

services:
  gateway:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=go-admin-kit-net
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=go-admin-kit-net
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1,172.22.0.1/32,172.28.0.0/16
      - --entrypoints.web.http.middlewares=gateway-ratelimit@docker,gateway-secure-headers@docker,gateway-compress@docker
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1,172.22.0.1/32,172.28.0.0/16
      - --entrypoints.websecure.http.middlewares=gateway-ratelimit@docker,gateway-secure-headers@docker,gateway-compress@docker
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      - --api.insecure=true
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${EDGE_CERT_HOST_DIR:-./certs/edge}:/certs/edge:ro
      - ${EDGE_TRAEFIK_DYNAMIC_DIR:-./certs/traefik-dynamic}:/etc/traefik/dynamic:ro
