    environment:
      CC_SIP_WSS_URL: ${CC_SIP_WSS_URL:-}
    # 全栈唯一无探针的服务：没有它，start-first 滚动更新等于“容器起来就切流量”，
    # rollback 对 frontend 永不触发——nginx 配置写坏也会照样滚上去。
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
    # 字面量长语法：stack deploy 要求 published 为整数，env 插值会变字符串
    - target: 80
      published: 13100
      protocol: tcp
    networks:
      go-admin-kit-net:
        aliases:
        - go-admin-kit-frontend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 32M
