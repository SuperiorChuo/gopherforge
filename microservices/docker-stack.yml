        traefik.http.routers.mp-open.rule: PathPrefix(`/api/v1/mp/callback`) || PathPrefix(`/api/v1/mp/health`)
        traefik.http.routers.mp-open.entrypoints: web,websecure
        traefik.http.routers.mp-open.priority: '110'
        traefik.http.services.mp.loadbalancer.server.port: '8092'
