      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      go-admin-kit-net:
        aliases:
        - go-admin-kit-file
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 32M
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        monitor: 20s
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 3s
      labels:
        traefik.enable: 'true'
        traefik.http.routers.file.rule: Path(`/api/v1/files`) || PathPrefix(`/api/v1/files/`) || PathPrefix(`/uploads/`)
        traefik.http.routers.file.entrypoints: web,websecure
        traefik.http.routers.file.priority: '100'
        traefik.http.services.file.loadbalancer.server.port: '8086'
  ai-service:
    image: ${IMAGE_PREFIX:-go-admin-kit}-ai-service:${IMAGE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "230MiB"
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8087
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
      AI_EMBED_PROVIDER: ${AI_EMBED_PROVIDER:-}
      AI_EMBED_BASE_URL: ${AI_EMBED_BASE_URL:-}
      AI_EMBED_API_KEY: ${AI_EMBED_API_KEY:-}
      # AI provider API key 落库前 AES-256 加密的密钥；生产必须恰好 32 字节
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Hermes 策略独立 Ed25519 信任根；base64 seed/private key，留空仅禁用 Hermes 签名接口
      HERMES_POLICY_SIGNING_KEY: ${HERMES_POLICY_SIGNING_KEY:-}
      HERMES_VERIFICATION_URI: ${HERMES_VERIFICATION_URI:-/hermes/mine}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-otel-collector:4317}
      TRACING_SERVICE_NAME: ${TRACING_SERVICE_NAME:-go-admin-kit-api}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8087/api/v1/health/live >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      go-admin-kit-net:
        aliases:
        - go-admin-kit-ai
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 32M
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        monitor: 20s
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 3s
      labels:
        traefik.enable: 'true'
        traefik.http.routers.ai.rule: PathPrefix(`/api/v1/ai/`)
        traefik.http.routers.ai.entrypoints: web,websecure
        traefik.http.routers.ai.priority: '100'
        traefik.http.routers.ai.middlewares: auth-chain@docker
        # Hermes 设备面与模型代理不带 JWT（enrollment device code / 设备签名 / model token），
        # 放行 ForwardAuth，鉴权在 handler 内做；/ai/internal/* 走容器网络 X-Internal-Token 自校验，刻意不放行网关。
        traefik.http.routers.ai-open.rule: PathPrefix(`/api/v1/ai/hermes/device`) || PathPrefix(`/api/v1/ai/hermes/proxy/`)
        traefik.http.routers.ai-open.entrypoints: web,websecure
        traefik.http.routers.ai-open.priority: '110'
        traefik.http.services.ai.loadbalancer.server.port: '8087'
