# Swarm 应用栈（全量）：除 gateway/migrate/监控 profile 外的全部服务由
# docker stack deploy 部署为 swarm service（滚动零停机/失败自动回滚）。
# 由 docker-compose.yml 的服务定义转换而来；compose 侧同名服务已 profile 门控
# （compose-fallback），仅存 build 定义与回退形态。
#
# 要点：
# - 副本策略：纯请求驱动 2 副本；带进程内 cron/hub/NATS durable 的 1 副本防双跑
#   （1 副本也享受 start-first 滚动零停机）
# - network alias 保住 go-admin-kit-<svc> 容器名 DNS，互调零改动
# - Traefik 路由在 deploy.labels（swarm provider）；auth-verify 中间件定义在
#   gateway 容器 labels（docker provider），此处引用带 @docker 后缀
# - 命名卷 external 钉旧名（单机数据零迁移；多机时为节点本地卷，im 旧附件/
#   file 本地兜底不跨节点——新文件均已走 MinIO，可接受）；./data 为 ip2region
# - 部署/热更新：bash scripts/swarm-redeploy.sh [服务名...]
# - 回退：docker stack rm gak && docker compose --profile compose-fallback up -d <svc...>
# - 镜像名：${IMAGE_PREFIX:-go-admin-kit}-<服务名>:${IMAGE_TAG:-latest}，两个变量
#   都不设时等于旧的 go-admin-kit-<服务名>:latest（swarm-redeploy.sh 里的
#   `docker compose -f docker-stack.yml config` 会就地展开，行为不变）。
#   跑正式版镜像：在 microservices/.env 写 IMAGE_TAG=v0.2.0（compose build 与
#   stack deploy 用的是同一套名字，不会错位）；要直接消费 registry 里的镜像再加
#   IMAGE_PREFIX=ghcr.io/<owner>/<repo>/go-admin-kit，注意 swarm-redeploy.sh 用的是
#   --resolve-image never，跨机拉取请改走 docker stack deploy --with-registry-auth。
services:
  auth-service:
    image: ${IMAGE_PREFIX:-go-admin-kit}-auth-service:${IMAGE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "230MiB"
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8082
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      JWT_REFRESH_TOKEN_ROTATION: ${JWT_REFRESH_TOKEN_ROTATION:-true}
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      GITHUB_OAUTH_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/github/callback}
      WECHAT_OAUTH_ENABLED: ${WECHAT_OAUTH_ENABLED:-false}
      WECHAT_CLIENT_ID: ${WECHAT_CLIENT_ID:-}
      WECHAT_CLIENT_SECRET: ${WECHAT_CLIENT_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/wechat/callback}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-otel-collector:4317}
      TRACING_SERVICE_NAME: ${TRACING_SERVICE_NAME:-go-admin-kit-api}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8082/api/v1/health/live >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      go-admin-kit-net:
        aliases:
        - go-admin-kit-auth
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 32M
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        monitor: 20s
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 3s
      labels:
        traefik.enable: 'true'
        traefik.http.routers.auth.rule: Path(`/api/v1/login`) || PathPrefix(`/api/v1/login/`) || Path(`/api/v1/register`) || Path(`/api/v1/refresh`) || Path(`/api/v1/logout`) || Path(`/api/v1/captcha`) || PathPrefix(`/api/v1/captcha/`) || PathPrefix(`/api/v1/oauth/`) || PathPrefix(`/api/v1/oauth2/`) || PathPrefix(`/api/v1/auth/`) || Path(`/api/v1/console-routes`) || PathPrefix(`/api/v1/console-routes/`) || PathPrefix(`/api/v1/password/`) || Path(`/api/v1/user/me`) || Path(`/api/v1/user/profile`) || Path(`/api/v1/user/password`) || PathPrefix(`/api/v1/user/2fa/`) || PathPrefix(`/api/v1/login-security/`)
        traefik.http.routers.auth.entrypoints: web,websecure
        traefik.http.routers.auth.priority: '100'
        traefik.http.services.auth.loadbalancer.server.port: '8082'
  identity-service:
    image: ${IMAGE_PREFIX:-go-admin-kit}-identity-service:${IMAGE_TAG:-latest}
