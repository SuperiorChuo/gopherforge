# Docker's embedded DNS keeps the gateway name resolvable after a container
# recreation. The variable-based proxy_pass below makes Nginx resolve it at
# request time instead of caching one container IP at startup.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # 官方镜像主配置里 gzip 是注释掉的，这里不开就是全量原文传输：
    # 3.9MB JS 产物按原文走网络，分包做得再细也补不回这个差距。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # nginx 1.21.1 起 mime.types 把 .js 归为 text/javascript，不列它的话
    # JS 产物（最大头）根本不进 gzip，只压了 CSS/JSON。两个类型都留，兼容新旧镜像。
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml text/xml application/xml;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gateway_upstream http://go-admin-kit-gateway:80;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "for=$remote_addr;proto=$scheme;host=$http_host";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Keep the original URI so Traefik can apply its existing /api routers.
    location = /api {
        proxy_pass $gateway_upstream;
    }

    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /uploads {
        proxy_pass $gateway_upstream;
    }

    location /uploads/ {
        proxy_pass $gateway_upstream;
    }

    # /im/desk and the other admin pages belong to the SPA, so only proxy
    # the realtime endpoint here instead of claiming the whole /im/ subtree.
    location = /im/ws {
        proxy_pass $gateway_upstream;
        proxy_read_timeout 3600s;
    }

    # 带哈希的构建产物永不变化，给一年 immutable 缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 容器启动时生成，允许生产 WSS 地址独立于前端构建更新。
    location = /runtime-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        types { application/javascript js; }
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # SPA：未命中代理路由的页面请求回退到 index.html。
    # index.html 必须每次协商校验（no-cache≠不缓存，是每次 revalidate），
    # 否则浏览器启发式缓存会让发版后仍看到旧页面。
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
