server {
    listen 80;
    server_name localhost;

    # 官方镜像主配置里 gzip 是注释掉的，这里不开就是全量原文传输：
    # JS 产物按原文走网络，分包做得再细也补不回这个差距。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # nginx 1.21.1 起 mime.types 把 .js 归为 text/javascript，不列它的话
    # JS 产物（最大头）根本不进 gzip，只压了 CSS/JSON。两个类型都留，兼容新旧镜像。
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml text/xml application/xml;

    # 带哈希的构建产物永不变化，给一年 immutable 缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA：API 由 Traefik 网关路由，本容器只托管静态资源。
    # index.html 必须每次协商校验（no-cache≠不缓存，是每次 revalidate），
    # 否则浏览器启发式缓存会让发版后仍看到旧页面。
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
