<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GAK 控制台" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Go Admin Kit</title>
    <script>
      // 首屏前应用已保存的主题，避免闪烁
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('app_theme') === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <style>
      html { background: #0a0b14; color-scheme: dark; }
      html[data-theme='light'] { background: #edf3fb; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
