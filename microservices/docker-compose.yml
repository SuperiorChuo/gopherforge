  # 工单 M1：客服闭环（IM 会话 → 工单 → 关单），AutoMigrate 自管表
  # ★ 已 swarm 化（docker-stack.yml，swarm-redeploy.sh 部署）：此处仅存
  # build 定义与回退形态，profile 门控防止 compose up 复活出双实例
  ticket-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: ticket
    image: ${IMAGE_PREFIX:-go-admin-kit}-ticket-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-ticket
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8094
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # 超时工单推站内信（notify-service internal/send）
      NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${TICKET_SERVICE_PORT:-8094}:8094"
    labels:
      traefik.enable: "true"
      traefik.http.routers.ticket.rule: "PathPrefix(`/api/v1/ticket`)"
      traefik.http.routers.ticket.entrypoints: web,websecure
      traefik.http.routers.ticket.priority: "100"
      traefik.http.routers.ticket.middlewares: auth-chain
      traefik.http.routers.ticket-open.rule: "PathPrefix(`/api/v1/ticket/health`)"
      traefik.http.routers.ticket-open.entrypoints: web,websecure
      traefik.http.routers.ticket-open.priority: "110"
      traefik.http.services.ticket.loadbalancer.server.port: "8094"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8094/api/v1/ticket/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  # 审批流 M2：轻量审批引擎（定义/实例/任务/日志/抄送，AutoMigrate 自管表；
  # 终态经 HTTP 回调业务方；超时提醒 ticker 见 BPM_TIMEOUT_SCAN_INTERVAL）
  # 支付中心 M1：渠道抽象+订单/退款状态机+收银台（mock 渠道闭环，AutoMigrate 自管表）
  # ★ 已 swarm 化（docker-stack.yml，swarm-redeploy.sh 部署）：此处仅存
  # build 定义与回退形态，profile 门控防止 compose up 复活出双实例
  pay-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: pay
    image: ${IMAGE_PREFIX:-go-admin-kit}-pay-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-pay
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8097
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # 业务方建单/退款内部端点共享密钥；为空=禁用 /internal 端点
      PAY_INTERNAL_TOKEN: ${PAY_INTERNAL_TOKEN:-}
      # 终态回调业务方时携带的 X-Internal-Token（业务侧内部端点鉴权）
      PAY_CALLBACK_TOKEN: ${PAY_CALLBACK_TOKEN:-}
      # 回调目标按 biz_type 注册：PAY_CALLBACK_<BIZTYPE>=完整 URL（默认无，业务方自行接线）
      PAY_ORDER_TTL_MINUTES: ${PAY_ORDER_TTL_MINUTES:-30}
      TZ: ${TZ:-Asia/Shanghai}
    labels:
      traefik.enable: "true"
      traefik.http.routers.pay.rule: "Path(`/api/v1/pay`) || PathPrefix(`/api/v1/pay/`)"
      traefik.http.routers.pay.entrypoints: web,websecure
      traefik.http.routers.pay.priority: "100"
      traefik.http.routers.pay.middlewares: auth-chain
      # 收银台（token 自校验）与 health 绕过 ForwardAuth，优先级更高；
      # 渠道回调端点（M2 微信/支付宝）届时加入此 open 路由
      traefik.http.routers.pay-open.rule: "PathPrefix(`/api/v1/pay/cashier/`) || PathPrefix(`/api/v1/pay/health`)"
      traefik.http.routers.pay-open.entrypoints: web,websecure
      traefik.http.routers.pay-open.priority: "110"
      traefik.http.services.pay.loadbalancer.server.port: "8097"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8097/api/v1/pay/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  bpm-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: bpm
    image: ${IMAGE_PREFIX:-go-admin-kit}-bpm-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-bpm
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8096
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # 内部端点共享密钥（crm → bpm 发起审批 / by-biz 反查）；为空=禁用 /internal 端点
      BPM_INTERNAL_TOKEN: ${BPM_INTERNAL_TOKEN:-}
      # 终态回调业务方时携带的 X-Internal-Token（业务侧内部端点鉴权，与 CRM 同值）
      BPM_CALLBACK_TOKEN: ${CRM_INTERNAL_TOKEN:-}
      # 回调目标按 biz_type 注册：BPM_CALLBACK_<BIZTYPE>=完整 URL
      BPM_CALLBACK_CRM_CONTRACT: ${BPM_CALLBACK_CRM_CONTRACT:-http://go-admin-kit-crm:8091/api/v1/crm/internal/bpm/callback}
      BPM_CALLBACK_CRM_PAYMENT: ${BPM_CALLBACK_CRM_PAYMENT:-http://go-admin-kit-crm:8091/api/v1/crm/internal/bpm/callback}
      # 新待办/抄送/终态结果/超时提醒 → notify-service 站内信
      NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      # 超时提醒扫描周期（M2 ticker，time.ParseDuration 语法）
      BPM_TIMEOUT_SCAN_INTERVAL: ${BPM_TIMEOUT_SCAN_INTERVAL:-5m}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${BPM_SERVICE_PORT:-8096}:8096"
    labels:
      traefik.enable: "true"
      traefik.http.routers.bpm.rule: "PathPrefix(`/api/v1/bpm`)"
      traefik.http.routers.bpm.entrypoints: web,websecure
      traefik.http.routers.bpm.priority: "100"
      traefik.http.routers.bpm.middlewares: auth-chain
      traefik.http.routers.bpm-open.rule: "PathPrefix(`/api/v1/bpm/health`)"
      traefik.http.routers.bpm-open.entrypoints: web,websecure
      traefik.http.routers.bpm-open.priority: "110"
      traefik.http.services.bpm.loadbalancer.server.port: "8096"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8096/api/v1/bpm/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  # 通知中心：站内信 + SMTP 邮件 + system-service 真实短信
  # ★ 已 swarm 化（docker-stack.yml，swarm-redeploy.sh 部署）：此处仅存
  # build 定义与回退形态，profile 门控防止 compose up 复活出双实例
  notify-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: notify
    image: ${IMAGE_PREFIX:-go-admin-kit}-notify-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-notify
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8095
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      NOTIFY_SYSTEM_SMS_URL: http://go-admin-kit-system:8084/internal/v1/sms/send
      SYSTEM_INTERNAL_TOKEN: ${SYSTEM_INTERNAL_TOKEN:-}
      # 邮件（可选）：配齐 HOST+FROM 后，模板 channels 含 email 才会发
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-587}
      NOTIFY_SMTP_USER: ${NOTIFY_SMTP_USER:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
      NOTIFY_SMTP_FROM: ${NOTIFY_SMTP_FROM:-}
      # 仅演示环境可回退 stub；生产短信由 system-service 投递
      NOTIFY_SMS_MODE: ${NOTIFY_SMS_MODE:-}
      NOTIFY_DEFAULT_CHANNELS: ${NOTIFY_DEFAULT_CHANNELS:-inbox}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${NOTIFY_SERVICE_PORT:-8095}:8095"
    labels:
      traefik.enable: "true"
      traefik.http.routers.notify.rule: "PathPrefix(`/api/v1/notify`)"
      traefik.http.routers.notify.entrypoints: web,websecure
      traefik.http.routers.notify.priority: "100"
      traefik.http.routers.notify.middlewares: auth-chain
      traefik.http.routers.notify-open.rule: "PathPrefix(`/api/v1/notify/health`)"
      traefik.http.routers.notify-open.entrypoints: web,websecure
      traefik.http.routers.notify-open.priority: "110"
      traefik.http.services.notify.loadbalancer.server.port: "8095"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8095/api/v1/notify/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  mp-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: mp
    image: ${IMAGE_PREFIX:-go-admin-kit}-mp-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-mp
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8092
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # access_token 中控（M2）用；空则 M1 仍可跑
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${MP_SERVICE_PORT:-8092}:8092"
    labels:
      traefik.enable: "true"
      # 后台管理接口挂 ForwardAuth
      traefik.http.routers.mp.rule: "PathPrefix(`/api/v1/mp`) || PathPrefix(`/api/v1/social`)"
      traefik.http.routers.mp.entrypoints: web,websecure
      traefik.http.routers.mp.priority: "100"
      traefik.http.routers.mp.middlewares: auth-chain
      # 微信回调（自己做微信签名校验）与 health 绕过 ForwardAuth，优先级更高
      traefik.http.routers.mp-open.rule: "PathPrefix(`/api/v1/mp/callback`) || PathPrefix(`/api/v1/mp/health`)"
      traefik.http.routers.mp-open.entrypoints: web,websecure
      traefik.http.routers.mp-open.priority: "110"
      traefik.http.services.mp.loadbalancer.server.port: "8092"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/api/v1/mp/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  frontend:
    profiles:
      - compose-fallback
    environment:
      CC_SIP_WSS_URL: ${CC_SIP_WSS_URL:-}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_CC_SIP_WS_URL: ${VITE_CC_SIP_WS_URL:-}
    image: ${IMAGE_PREFIX:-go-admin-kit}-frontend:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "PathPrefix(`/`)"
      traefik.http.routers.frontend.entrypoints: web,websecure
      traefik.http.routers.frontend.priority: "1"
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    networks:
      - go-admin-kit-net

  gateway:
    # v3.6+ negotiates the Docker API version; older Traefik pins 1.24, which
    # current Docker daemons reject ("client version 1.24 is too old").
    image: traefik:v3.6
    container_name: go-admin-kit-gateway
    restart: unless-stopped
    labels:
      # auth-verify 中间件定义挂在 gateway（常驻 docker provider）：
      # auth-service 已迁 swarm，定义不能跟着走，否则两边 provider 都找不到
      traefik.enable: "true"
      traefik.http.middlewares.auth-verify.forwardauth.address: "http://go-admin-kit-auth:8082/internal/verify"
      traefik.http.middlewares.auth-verify.forwardauth.authResponseHeaders: "X-Auth-User-ID,X-Auth-Username,X-Auth-Tenant-ID,X-Auth-Platform-Admin,X-Auth-Permissions"
      traefik.http.middlewares.auth-sanitize.headers.customRequestHeaders.X-Auth-User-ID: ""
      traefik.http.middlewares.auth-sanitize.headers.customRequestHeaders.X-Auth-Username: ""
      traefik.http.middlewares.auth-sanitize.headers.customRequestHeaders.X-Auth-Tenant-ID: ""
      traefik.http.middlewares.auth-sanitize.headers.customRequestHeaders.X-Auth-Platform-Admin: ""
      traefik.http.middlewares.auth-sanitize.headers.customRequestHeaders.X-Auth-Permissions: ""
      traefik.http.middlewares.auth-chain.chain.middlewares: "auth-sanitize,auth-verify"
      # 网关层全局限流：挂在 entrypoint（web）上，覆盖全部 15 个服务，一处配置。
      # average/burst 可按部署规模调；Traefik 是令牌桶，平均速率 + 突发上限。
      # 内网宽松为主（防滥用而非精确配额），真实域名/公网接入时应收紧。
      traefik.http.middlewares.gateway-ratelimit.ratelimit.average: "${GATEWAY_RATE_AVERAGE:-100}"
      traefik.http.middlewares.gateway-ratelimit.ratelimit.burst: "${GATEWAY_RATE_BURST:-200}"
      # 网关安全响应头（全局限流之后的第二层，覆盖全部路由）：
      # - CSP 刻意不做：当前前端内联/动态资源多，贸然加会破坏加载，需先审计资源清单
      # - HSTS 等 websecure 全量生效后再开（HTTP 下开 HSTS 会把浏览器锁死在 https）
      traefik.http.middlewares.gateway-secure-headers.headers.customResponseHeaders.X-Content-Type-Options: "nosniff"
      traefik.http.middlewares.gateway-secure-headers.headers.customResponseHeaders.X-Frame-Options: "SAMEORIGIN"
      traefik.http.middlewares.gateway-secure-headers.headers.customResponseHeaders.Referrer-Policy: "strict-origin-when-cross-origin"
      traefik.http.middlewares.gateway-secure-headers.headers.customResponseHeaders.Permissions-Policy: "camera=(), microphone=(), geolocation=()"
      # HSTS：stsSeconds>0 才下发（Traefik 无 strictTransportSecurity 字段）。
      # 域名+真证书就绪后在 .env 配 GATEWAY_HSTS_SECONDS=31536000——浏览器会锁死 https，
      # 自签兜底期间绝不能开（误开则用户无法回退 http）。
      traefik.http.middlewares.gateway-secure-headers.headers.stsSeconds: "${GATEWAY_HSTS_SECONDS:-0}"
      traefik.http.middlewares.gateway-secure-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.gateway-secure-headers.headers.stsPreload: "true"
      # 网关层响应压缩：API JSON 此前经 18100 全量原文传输（Go 服务无 gzip；
      # 13100 的 nginx 反而压了）。前端静态经 nginx 已带 Content-Encoding，
      # Traefik 对已编码响应自动跳过，不会双压；默认 >=1KB 才压。
      traefik.http.middlewares.gateway-compress.compress: "true"
      # HTTP→HTTPS 重定向中间件（入口 web → 跳 websecure）。不设 scheme 或设为 https
      # 即激活全站跳转；默认 http = 不跳转（向后兼容）。
      traefik.http.middlewares.gateway-https-redirect.redirectscheme.scheme: "${GATEWAY_HTTPS_REDIRECT_SCHEME:-http}"
      traefik.http.middlewares.gateway-https-redirect.redirectscheme.permanent: "true"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=go-admin-kit-net
      # swarm provider：路由 docker-stack.yml 里的 swarm service（deploy.labels）；
      # 与 docker provider 共存，跨 provider 引用中间件用 <name>@docker 后缀
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=go-admin-kit-net
      - --entrypoints.web.address=:80
      # 信任转发源（隧道/宿主 loopback/gwbridge/overlay）采用 Caddy 的 X-Forwarded-For 真实 IP
      - --entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1,172.22.0.1/32,172.28.0.0/16
      # entrypoint 级限流：所有 web 流量先过网关限流中间件（再进 ForwardAuth）
      - --entrypoints.web.http.middlewares=gateway-ratelimit@docker,gateway-secure-headers@docker,gateway-compress@docker
      # TLS-ready：websecure 端口 + 自签兜底。109 内网无域名，真实证书属等外部；
      # 有域名时在 .env 配 ACME_EMAIL + 放开下方 certresolver 两行即启用 Let's Encrypt。
      # Traefik 未配证书解析器时对 websecure 请求用内置自签证书兜底，保证 TLS 不中断。
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1,172.22.0.1/32,172.28.0.0/16
      # websecure 与 web 同中间件链：限流/安全头/压缩全覆盖（此前只挂 web，
      # TLS 落地后 443 端口裸奔）。HSTS 由 GATEWAY_HSTS_ENABLED 门控。
      - --entrypoints.websecure.http.middlewares=gateway-ratelimit@docker,gateway-secure-headers@docker,gateway-compress@docker
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # TLS 基线：Traefik 内置 default@internal 即 TLS 1.2+ 现代 cipher（无需自定义）。
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
      # Prometheus 指标：随 api.insecure 暴露在 :8080/metrics（宿主只绑 loopback，
      # 网络内由 prometheus 容器抓取）。router 级标签开着才有按路由的 P99。
      - --metrics.prometheus=true
      - --metrics.prometheus.addrouterslabels=true
      # Dashboard/API for inspecting routers; the host port below binds it to
      # loopback only. Remove both lines if you don't want it at all.
      # 决策：loopback-only（127.0.0.1:8090）已保证公网不可达；若要加认证，
      # 在此加 traefik.http.middlewares.dashboard-auth.basicauth.users 并挂到
      # api.dashboard 路由（当前无独立 dashboard router，api.insecure 直供）。
      - --api.insecure=true
    ports:
      - "${GATEWAY_PORT:-8000}:80"
      - "${GATEWAY_TLS_PORT:-18443}:443"
      - "127.0.0.1:8090:8080"
    volumes:
      # Docker Desktop for Mac denies container access to /var/run/docker.sock;
      # set DOCKER_SOCK=/var/run/docker.sock.raw in .env there. Linux keeps the default.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 6
    networks:
      - go-admin-kit-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: go-admin-kit-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../platform/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../platform/deploy/prometheus/rules:/etc/prometheus/rules:ro
      - go_admin_kit_prometheus_data:/prometheus
    networks:
      - go-admin-kit-net

  # 告警出口（告警闭环②）：Prometheus 规则 → 本容器分组去抖 → notify webhook
  # 站内信。配置是模板：启动时 sed 把 NOTIFY_INTERNAL_TOKEN 注入 Bearer 凭据
  # （真实密钥只在 .env，不进 git 的配置文件）。
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: go-admin-kit-alertmanager
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      # 企业微信群机器人 webhook（带外 critical 告警）；未配时 critical 仍有站内信兜底
      WECOM_WEBHOOK: ${WECOM_WEBHOOK:-http://127.0.0.1:1/blackhole}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed -e "s|__NOTIFY_TOKEN__|$$NOTIFY_INTERNAL_TOKEN|" -e "s|__WECOM_WEBHOOK__|$$WECOM_WEBHOOK|" /etc/alertmanager/alertmanager.tpl.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../platform/deploy/alertmanager/alertmanager.tpl.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - go_admin_kit_alertmanager_data:/alertmanager
    networks:
      - go-admin-kit-net

  # 主机指标（磁盘/内存/CPU）：挂宿主根只读；网络走 compose 网（够判磁盘内存）。
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: go-admin-kit-node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - go-admin-kit-net

  # 统一日志（运维⑤）：Loki 存储 + promtail 采集全容器 stdout，Grafana 里查
  # （Explore → Loki，{service="cc"} |= "keyword"）。保留 7 天，filesystem 存储。
  loki:
    image: grafana/loki:3.1.1
    container_name: go-admin-kit-loki
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ../platform/deploy/loki/loki-config.yml:/etc/loki/config.yml:ro
      - go_admin_kit_loki_data:/loki
    networks:
      - go-admin-kit-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: go-admin-kit-promtail
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ../platform/deploy/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      # docker_sd + 容器日志都要 docker.sock（只读）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - go-admin-kit-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: go-admin-kit-grafana
    restart: unless-stopped
    # 与 prometheus 同 profile：默认渲染不悬空 depends_on，monitoring profile 一起起
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 管理后台 iframe 嵌入看板：允许匿名 Viewer 只读 + 放开 X-Frame 限制。
      # Grafana 只在内网端口暴露，匿名仅 Viewer 角色，可接受；公网部署需收紧。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - go_admin_kit_grafana_data:/var/lib/grafana
      - ../platform/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - go-admin-kit-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: go-admin-kit-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otelcol/config.yaml
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    volumes:
      - ../platform/deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - go-admin-kit-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: go-admin-kit-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /jaeger
      TZ: ${TZ:-Asia/Shanghai}
    # 不再暴露宿主机端口；经 Traefik 网关 /jaeger 路径访问（需登录鉴权）。
    labels:
      traefik.enable: "true"
      traefik.http.routers.jaeger.rule: PathPrefix("/jaeger")
      traefik.http.routers.jaeger.entrypoints: web
      traefik.http.routers.jaeger.middlewares: auth-chain@docker
      traefik.http.services.jaeger.loadbalancer.server.port: "16686"
    networks:
      - go-admin-kit-net

networks:
  # 与 infra 栈共享的外部网络。子网钉在 172.28.0.0/16（TRUSTED_PROXIES 白名单
  # 依赖它，改动需同步 backend/auth-service 的 TRUSTED_PROXIES env）；
  # 另信任 172.22.0.1/32（docker_gwbridge SNAT 源——公网经 Caddy→隧道→宿主端口
  # 映射后的实际连接源，由宿主机 Docker default-address-pool 决定，非本 compose 定义）。
  # 创建命令见 docker-compose.infra.yml 头部，deploy 脚本已内置。
  go-admin-kit-net:
    external: true
    name: go-admin-kit-net

volumes:
  im_uploads:
  go_admin_kit_uploads:
  go_admin_kit_prometheus_data:
  go_admin_kit_alertmanager_data:
  go_admin_kit_loki_data:
  go_admin_kit_grafana_data:
