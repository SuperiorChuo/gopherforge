# 应用栈：无状态服务 + 网关 + 前端。
# 有状态服务（PG/Redis/NATS/MinIO）在独立 infra 栈 docker-compose.infra.yml
# （project go-admin-kit-infra），本栈任意 down/up/rebuild 不触碰数据服务；
# 两栈经外部网络 go-admin-kit-net 互通（创建方式见 infra 文件头部）。
#
# 镜像命名（发版用）：每个可构建服务都显式声明
#   image: ${IMAGE_PREFIX:-go-admin-kit}-<服务名>:${IMAGE_TAG:-latest}
# 两个变量都不设时结果是 go-admin-kit-<服务名>:latest —— 与 Compose 从
# project 名推导出来的旧名字完全一致，本机开发 / swarm-redeploy.sh / CI bake
# 全部零改动。发版后要跑某个版本：
#   IMAGE_TAG=v0.2.0 docker compose ... （构建与部署用同一套名字，不会错位）
# 要拉 registry 里的镜像而不是本地构建：
#   IMAGE_PREFIX=ghcr.io/superiorchuo/gopherforge/go-admin-kit IMAGE_TAG=v0.2.0 ...
# （IMAGE_PREFIX 不带结尾连字符，服务名会以 -<服务名> 追加）
name: go-admin-kit

services:
  # 一次性迁移 job：复用 monitor 镜像跑 goose up 后退出。
  # 把迁移从 monitor 常驻进程中剥离，迁移失败不再拖垮监控/健康检查，
  # 各业务服务通过 depends_on service_completed_successfully 等它完成。
  # infra 栈独立后无法再对 postgres 做跨栈健康等待，改为有界重试：
  # PG 未就绪时等待重试，真实迁移错误在重试耗尽后以非零码失败。
  migrate:
    build:
      context: ./services
      dockerfile: monitor/Dockerfile
    image: ${IMAGE_PREFIX:-go-admin-kit}-monitor-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-migrate
    restart: "no"
    command: ["sh", "-c", "n=0; until ./migrate -config ./configs/config.yaml -dir ./migrations up; do n=$$((n+1)); [ $$n -ge 30 ] && exit 1; echo \"[migrate] not ready, retry $$n/30\"; sleep 2; done"]
    environment:
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - go-admin-kit-net

  monitor-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: monitor/Dockerfile
    image: ${IMAGE_PREFIX:-go-admin-kit}-monitor-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-monitor
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8081
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      JWT_REFRESH_TOKEN_ROTATION: ${JWT_REFRESH_TOKEN_ROTATION:-true}
      UPLOAD_STORAGE_TYPE: ${UPLOAD_STORAGE_TYPE:-local}
      UPLOAD_LOCAL_PATH: ${UPLOAD_LOCAL_PATH:-./uploads}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-/uploads}
      UPLOAD_LOCAL_URL_PREFIX: ${UPLOAD_LOCAL_URL_PREFIX:-/uploads}
      UPLOAD_S3_ENDPOINT: ${UPLOAD_S3_ENDPOINT:-}
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET:-}
      UPLOAD_S3_REGION: ${UPLOAD_S3_REGION:-}
      UPLOAD_S3_ACCESS_KEY: ${UPLOAD_S3_ACCESS_KEY:-}
      UPLOAD_S3_SECRET_KEY: ${UPLOAD_S3_SECRET_KEY:-}
      UPLOAD_S3_USE_SSL: ${UPLOAD_S3_USE_SSL:-true}
      UPLOAD_MINIO_ENDPOINT: ${UPLOAD_MINIO_ENDPOINT:-go-admin-kit-minio:9000}
      UPLOAD_MINIO_BUCKET: ${UPLOAD_MINIO_BUCKET:-go-admin-kit}
      UPLOAD_MINIO_REGION: ${UPLOAD_MINIO_REGION:-us-east-1}
      UPLOAD_MINIO_ACCESS_KEY: ${UPLOAD_MINIO_ACCESS_KEY:-minioadmin}
      UPLOAD_MINIO_SECRET_KEY: ${UPLOAD_MINIO_SECRET_KEY:-minioadmin}
      UPLOAD_MINIO_USE_SSL: ${UPLOAD_MINIO_USE_SSL:-false}
      EMAIL_NOTIFICATION_ENABLED: ${EMAIL_NOTIFICATION_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_ALERT_RECEIVER: ${EMAIL_ALERT_RECEIVER:-}
      EMAIL_ALERT_RECEIVERS: ${EMAIL_ALERT_RECEIVERS:-}
      EMAIL_SUBJECT_TEMPLATE: ${EMAIL_SUBJECT_TEMPLATE:-}
      EMAIL_BODY_TEMPLATE: ${EMAIL_BODY_TEMPLATE:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_START_TLS: ${EMAIL_START_TLS:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      DEFAULT_ADMIN_WARN_DEFAULT_PASSWORD: ${DEFAULT_ADMIN_WARN_DEFAULT_PASSWORD:-true}
      DEFAULT_ADMIN_FORCE_CHANGE_PASSWORD: ${DEFAULT_ADMIN_FORCE_CHANGE_PASSWORD:-false}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_SERVICE_NAME: ${TRACING_SERVICE_NAME:-go-admin-kit-api}
      TRACING_ENVIRONMENT: ${TRACING_ENVIRONMENT:-development}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-otel-collector:4317}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1.0}
      # NATS consumer moved to audit-service; empty disables the monolith's
      # login-log consumer (same durable name must not be attached twice).
      NATS_URL: ""
      # Trust the compose network (see networks.ipam) so X-Forwarded-For from
      # the Traefik gateway yields the real client IP in logs and rate limits.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 服务信任网关注入的 X-Auth-* 头，绝不能被网关以外的来源直连：
      # 默认只绑 loopback（宿主机上调试用），公网/内网入口一律走 gateway。
      - "${SERVICES_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8081}:8081"
    labels:
      traefik.enable: "true"
      traefik.http.routers.monitor.rule: "PathPrefix(`/api`) || PathPrefix(`/uploads`)"
      traefik.http.routers.monitor.entrypoints: web,websecure
      traefik.http.routers.monitor.middlewares: auth-chain
      traefik.http.services.monitor.loadbalancer.server.port: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  auth-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    image: ${IMAGE_PREFIX:-go-admin-kit}-auth-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-auth
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8082
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      JWT_REFRESH_TOKEN_ROTATION: ${JWT_REFRESH_TOKEN_ROTATION:-true}
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      GITHUB_OAUTH_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/github/callback}
      WECHAT_OAUTH_ENABLED: ${WECHAT_OAUTH_ENABLED:-false}
      WECHAT_CLIENT_ID: ${WECHAT_CLIENT_ID:-}
      WECHAT_CLIENT_SECRET: ${WECHAT_CLIENT_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/wechat/callback}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      # Same trusted-proxy range as backend; login events and login-limit
      # keys must see the real client IP, not the gateway's.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${AUTH_SERVICE_PORT:-8082}:8082"
    labels:
      traefik.enable: "true"
      # PathPrefix is a raw string prefix, not segment-aligned: `/api/v1/login`
      # would also capture `/api/v1/login-logs` and `/api/v1/user/me` would
      # capture `/api/v1/user/menus` (both monolith routes). Exact-path routes
      # use Path(); only true subtrees use PathPrefix() with a trailing slash.
      traefik.http.routers.auth.rule: "Path(`/api/v1/login`) || PathPrefix(`/api/v1/login/`) || Path(`/api/v1/register`) || Path(`/api/v1/refresh`) || Path(`/api/v1/logout`) || Path(`/api/v1/captcha`) || PathPrefix(`/api/v1/captcha/`) || PathPrefix(`/api/v1/oauth/`) || PathPrefix(`/api/v1/oauth2/`) || PathPrefix(`/api/v1/auth/`) || Path(`/api/v1/console-routes`) || PathPrefix(`/api/v1/console-routes/`) || PathPrefix(`/api/v1/password/`) || Path(`/api/v1/user/me`) || Path(`/api/v1/user/profile`) || Path(`/api/v1/user/password`) || PathPrefix(`/api/v1/user/2fa/`)"
      traefik.http.routers.auth.entrypoints: web,websecure
      traefik.http.routers.auth.priority: "100"
      traefik.http.services.auth.loadbalancer.server.port: "8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  identity-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: identity
    image: ${IMAGE_PREFIX:-go-admin-kit}-identity-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-identity
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8083
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${IDENTITY_SERVICE_PORT:-8083}:8083"
    labels:
      traefik.enable: "true"
      # Same PathPrefix caveat as the auth router: exact paths use Path(),
      # subtrees use a trailing-slash PathPrefix(). `/user/...` (singular,
      # monolith + auth-service) must NOT match `/users`.
      traefik.http.routers.identity.rule: "Path(`/api/v1/users`) || PathPrefix(`/api/v1/users/`) || Path(`/api/v1/roles`) || PathPrefix(`/api/v1/roles/`) || Path(`/api/v1/permissions`) || PathPrefix(`/api/v1/permissions/`) || Path(`/api/v1/departments`) || PathPrefix(`/api/v1/departments/`) || Path(`/api/v1/tenants`) || PathPrefix(`/api/v1/tenants/`) || Path(`/api/v1/posts`) || PathPrefix(`/api/v1/posts/`) || Path(`/api/v1/tenant-packages`) || PathPrefix(`/api/v1/tenant-packages/`)"
      traefik.http.routers.identity.entrypoints: web,websecure
      traefik.http.routers.identity.priority: "100"
      traefik.http.services.identity.loadbalancer.server.port: "8083"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  system-service:
    profiles:
      - compose-fallback
    build:
      context: .
      dockerfile: services/system/Dockerfile
    image: ${IMAGE_PREFIX:-go-admin-kit}-system-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-system
    restart: unless-stopped
    volumes:
      # 离线 IP 归属地库（在线用户归属地）；文件缺失时服务优雅降级
      - ./data:/app/data:ro
    environment:
      IP2REGION_XDB: /app/data/ip2region.xdb
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8084
      SYSTEM_INTERNAL_TOKEN: ${SYSTEM_INTERNAL_TOKEN:-}
      CODEGEN_REPO_ROOT: ${CODEGEN_REPO_ROOT:-/app/repository-snapshot}
      CODEGEN_WRITE_ENABLED: ${CODEGEN_WRITE_ENABLED:-false}
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      EMAIL_NOTIFICATION_ENABLED: ${EMAIL_NOTIFICATION_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_ALERT_RECEIVERS: ${EMAIL_ALERT_RECEIVERS:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${SYSTEM_SERVICE_PORT:-8084}:8084"
    labels:
      traefik.enable: "true"
      # Same PathPrefix caveat as the auth/identity routers: exact paths use
      # Path(), subtrees use a trailing-slash PathPrefix(). `/user/menus` is
      # an exact path so it can't collide with auth's /user/me etc.
      traefik.http.routers.system.rule: "Path(`/api/v1/menus`) || PathPrefix(`/api/v1/menus/`) || Path(`/api/v1/user/menus`) || Path(`/api/v1/dict-types`) || PathPrefix(`/api/v1/dict-types/`) || Path(`/api/v1/dict-items`) || PathPrefix(`/api/v1/dict-items/`) || Path(`/api/v1/dicts`) || PathPrefix(`/api/v1/dicts/`) || Path(`/api/v1/notices`) || PathPrefix(`/api/v1/notices/`) || Path(`/api/v1/system-settings`) || PathPrefix(`/api/v1/system-settings/`) || Path(`/api/v1/online-users`) || PathPrefix(`/api/v1/online-users/`) || Path(`/api/v1/ws/notifications`) || PathPrefix(`/api/v1/ws/notifications/`) || Path(`/api/v1/system/weather`) || PathPrefix(`/api/v1/codegen/`) || PathPrefix(`/api/v1/sms/`) || Path(`/api/v1/error-codes`) || PathPrefix(`/api/v1/error-codes/`)"
      traefik.http.routers.system.entrypoints: web,websecure
      traefik.http.routers.system.priority: "100"
      traefik.http.services.system.loadbalancer.server.port: "8084"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  audit-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: audit
    image: ${IMAGE_PREFIX:-go-admin-kit}-audit-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-audit
    restart: unless-stopped
    volumes:
      # 离线 IP 归属地库（登录日志归属地）；文件缺失时回退在线查询
      - ./data:/app/data:ro
    environment:
      IP2REGION_XDB: /app/data/ip2region.xdb
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8085
      # 操作/登录日志保留天数；<=0（默认）关闭自动清理，audit_logs 不在清理范围
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-0}
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${AUDIT_SERVICE_PORT:-8085}:8085"
    labels:
      traefik.enable: "true"
      traefik.http.routers.audit.rule: "Path(`/api/v1/login-logs`) || PathPrefix(`/api/v1/login-logs/`) || Path(`/api/v1/operation-logs`) || PathPrefix(`/api/v1/operation-logs/`) || Path(`/api/v1/logs/audit`)"
      traefik.http.routers.audit.entrypoints: web,websecure
      traefik.http.routers.audit.priority: "100"
      traefik.http.services.audit.loadbalancer.server.port: "8085"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  file-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: file
    image: ${IMAGE_PREFIX:-go-admin-kit}-file-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-file
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8086
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      UPLOAD_STORAGE_TYPE: ${UPLOAD_STORAGE_TYPE:-local}
      UPLOAD_LOCAL_PATH: ${UPLOAD_LOCAL_PATH:-./uploads}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-/uploads}
      UPLOAD_LOCAL_URL_PREFIX: ${UPLOAD_LOCAL_URL_PREFIX:-/uploads}
      UPLOAD_S3_ENDPOINT: ${UPLOAD_S3_ENDPOINT:-}
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET:-}
      UPLOAD_S3_REGION: ${UPLOAD_S3_REGION:-}
      UPLOAD_S3_ACCESS_KEY: ${UPLOAD_S3_ACCESS_KEY:-}
      UPLOAD_S3_SECRET_KEY: ${UPLOAD_S3_SECRET_KEY:-}
      UPLOAD_S3_USE_SSL: ${UPLOAD_S3_USE_SSL:-true}
      UPLOAD_MINIO_ENDPOINT: ${UPLOAD_MINIO_ENDPOINT:-go-admin-kit-minio:9000}
      UPLOAD_MINIO_BUCKET: ${UPLOAD_MINIO_BUCKET:-go-admin-kit}
      UPLOAD_MINIO_REGION: ${UPLOAD_MINIO_REGION:-us-east-1}
      UPLOAD_MINIO_ACCESS_KEY: ${UPLOAD_MINIO_ACCESS_KEY:-minioadmin}
      UPLOAD_MINIO_SECRET_KEY: ${UPLOAD_MINIO_SECRET_KEY:-minioadmin}
      UPLOAD_MINIO_USE_SSL: ${UPLOAD_MINIO_USE_SSL:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${FILE_SERVICE_PORT:-8086}:8086"
    volumes:
      - go_admin_kit_uploads:/app/uploads
    labels:
      traefik.enable: "true"
      # /uploads static subtree moves here from the monolith together with
      # the file APIs (priority 100 beats the backend's catch-all /uploads).
      traefik.http.routers.file.rule: "Path(`/api/v1/files`) || PathPrefix(`/api/v1/files/`) || PathPrefix(`/uploads/`)"
      traefik.http.routers.file.entrypoints: web,websecure
      traefik.http.routers.file.priority: "100"
      traefik.http.services.file.loadbalancer.server.port: "8086"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  ai-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: ai
    image: ${IMAGE_PREFIX:-go-admin-kit}-ai-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-ai
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8087
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: go-admin-kit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # im-service 向量检索内网 token（与 im 的 AI_INTERNAL_TOKEN 一致）
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
      AI_EMBED_PROVIDER: ${AI_EMBED_PROVIDER:-}
      AI_EMBED_BASE_URL: ${AI_EMBED_BASE_URL:-}
      AI_EMBED_API_KEY: ${AI_EMBED_API_KEY:-}
      # AI provider API key 落库前 AES-256 加密的密钥；生产必须恰好 32 字节
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Hermes 策略独立 Ed25519 信任根；base64 seed/private key，留空仅禁用 Hermes 签名接口
      HERMES_POLICY_SIGNING_KEY: ${HERMES_POLICY_SIGNING_KEY:-}
      HERMES_VERIFICATION_URI: ${HERMES_VERIFICATION_URI:-/hermes/mine}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,172.22.0.1/32}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${AI_SERVICE_PORT:-8087}:8087"
    labels:
      traefik.enable: "true"
      traefik.http.routers.ai.rule: "PathPrefix(`/api/v1/ai/`)"
      traefik.http.routers.ai.entrypoints: web,websecure
      traefik.http.routers.ai.priority: "100"
      traefik.http.routers.ai.middlewares: auth-chain
      # Hermes 设备面不带 JWT：enrollment（高熵 device code + 自身限流）与
      # device/*（设备签名鉴权）放行 ForwardAuth；/ai/internal/* 是容器网络
      # 服务间调用（X-Internal-Token 自校验），刻意不放行网关入口。
      traefik.http.routers.ai-open.rule: "PathPrefix(`/api/v1/ai/hermes/device`)"
      traefik.http.routers.ai-open.entrypoints: web,websecure
      traefik.http.routers.ai-open.priority: "110"
      traefik.http.services.ai.loadbalancer.server.port: "8087"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  im-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: im
    image: ${IMAGE_PREFIX:-go-admin-kit}-im-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-im
    restart: unless-stopped
    environment:
      IP2REGION_XDB: /app/data/ip2region.xdb
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8088
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000}
      TZ: ${TZ:-Asia/Shanghai}
      # WS 跨实例广播（单实例也安全；空值退回进程内直投）
      # 关闭会话保留天数，超期硬删消息与附件（0=永久）
      IM_RETENTION_DAYS: ${IM_RETENTION_DAYS:-180}
      # 知识库向量检索（M1.5）：调 ai-service 内网接口，失败降级关键词
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8087}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # 转人工站内信（notify-service）
      NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      # 附件走 MinIO（im/ 前缀共享 bucket）；本地卷保留作旧文件回源
      IM_STORAGE_TYPE: ${IM_STORAGE_TYPE:-minio}
      UPLOAD_MINIO_ENDPOINT: ${UPLOAD_MINIO_ENDPOINT:-go-admin-kit-minio:9000}
      UPLOAD_MINIO_BUCKET: ${UPLOAD_MINIO_BUCKET:-go-admin-kit}
      UPLOAD_MINIO_ACCESS_KEY: ${UPLOAD_MINIO_ACCESS_KEY:-minioadmin}
      UPLOAD_MINIO_SECRET_KEY: ${UPLOAD_MINIO_SECRET_KEY:-minioadmin}
      UPLOAD_MINIO_USE_SSL: ${UPLOAD_MINIO_USE_SSL:-false}
    volumes:
      - im_uploads:/app/uploads
      # 离线 IP 归属地库（访客地域识别）；文件缺失时保留粗分类
      - ./data:/app/data:ro
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${IM_SERVICE_PORT:-8088}:8088"
    labels:
      traefik.enable: "true"
      # IM REST + visitor H5 + websocket
      traefik.http.routers.im.rule: "PathPrefix(`/api/v1/im`) || PathPrefix(`/im/`)"
      traefik.http.routers.im.entrypoints: web,websecure
      traefik.http.routers.im.priority: "100"
      traefik.http.routers.im.middlewares: auth-chain
      traefik.http.services.im.loadbalancer.server.port: "8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/api/v1/im/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  cc-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: cc
    image: ${IMAGE_PREFIX:-go-admin-kit}-cc-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-cc
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8089
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # freeswitch-cc control-api 对接：webhook HMAC 密钥与 control-api 同源；
      # CC_FS_API_BASE 为空则禁用 fs/status、fs/webhook-test 代理。
      CC_WEBHOOK_SECRET: ${CC_WEBHOOK_SECRET:-}
      CC_FS_API_BASE: ${CC_FS_API_BASE:-}
      CC_FS_TOKEN: ${CC_FS_TOKEN:-}
      CC_RECORDING_PUBLIC_BASE: ${CC_RECORDING_PUBLIC_BASE:-}
      # mod_json_cdr 话单直投 Basic 凭据（user:pass，与 FS 侧 CC_CDR_CRED 一致）
      CC_CDR_AUTH: ${CC_CDR_AUTH:-}
      # CRM 打通：号码识客 + 挂机写跟进走 crm 内部端点（内网直连，X-Internal-Token）。
      # 两者任一为空=不接 CRM（识客只返回 cc 侧数据，挂机不写跟进）。
      CC_CRM_API_BASE: ${CC_CRM_API_BASE:-http://go-admin-kit-crm:8091}
      CC_CRM_INTERNAL_TOKEN: ${CRM_INTERNAL_TOKEN:-}
      # 提示音库 TTS 预生成（OpenAI 兼容 /v1/audio/speech）；CC_TTS_URL 为空=禁用 TTS
      CC_TTS_URL: ${CC_TTS_URL:-}
      CC_TTS_KEY: ${CC_TTS_KEY:-}
      CC_TTS_MODEL: ${CC_TTS_MODEL:-}
      CC_TTS_VOICE: ${CC_TTS_VOICE:-}
      # 录音转写质检 ASR（OpenAI 兼容 /v1/audio/transcriptions）；CC_ASR_URL 为空=禁用转写
      CC_ASR_URL: ${CC_ASR_URL:-}
      CC_ASR_KEY: ${CC_ASR_KEY:-}
      CC_ASR_MODEL: ${CC_ASR_MODEL:-}
      # 余额预警：notify 内调站内信（每小时扫可用额≤阈值租户，按天去重）；Base 为空=禁用
      CC_NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      CC_NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      CC_BALANCE_WARN_FEN: ${CC_BALANCE_WARN_FEN:-1000}
      CC_BALANCE_WARN_USER: ${CC_BALANCE_WARN_USER:-1}
      # 欠费自动冻结（可用额≤0 自动冻结+联动停用线路）；默认关，生产确认后再开
      CC_AUTO_FREEZE: ${CC_AUTO_FREEZE:-false}
      # cc_webhook_logs 留档天数（每日清理）
      CC_WEBHOOK_LOG_KEEP_DAYS: ${CC_WEBHOOK_LOG_KEEP_DAYS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${CC_SERVICE_PORT:-8089}:8089"
    labels:
      traefik.enable: "true"
      # admin 路由走 ForwardAuth（服务内网关头优先、JWT 兜底）
      traefik.http.routers.cc.rule: "PathPrefix(`/api/v1/cc`)"
      traefik.http.routers.cc.entrypoints: web,websecure
      traefik.http.routers.cc.priority: "100"
      traefik.http.routers.cc.middlewares: auth-chain
      # webhook（HMAC 验签）、cdr（Basic）、cid（mod_cidlookup 直连，裸文本）、
      # ws（浏览器 WS 握手带不了 Authorization 头，端点内 ?token= 自校验）与
      # 健康检查不走 ForwardAuth，优先级更高
      traefik.http.routers.cc-open.rule: "Path(`/api/v1/cc/webhook`) || Path(`/api/v1/cc/cdr`) || Path(`/api/v1/cc/cid`) || Path(`/api/v1/cc/ws`) || PathPrefix(`/api/v1/cc/health`)"
      traefik.http.routers.cc-open.entrypoints: web,websecure
      traefik.http.routers.cc-open.priority: "110"
      traefik.http.services.cc.loadbalancer.server.port: "8089"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/api/v1/cc/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  crm-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: crm
    image: ${IMAGE_PREFIX:-go-admin-kit}-crm-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-crm
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8091
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      # 内部端点共享密钥（cc → crm 号码识客/挂机写跟进）；为空=禁用 /internal 端点
      CRM_INTERNAL_TOKEN: ${CRM_INTERNAL_TOKEN:-}
      # 回访到期 / 公海回收 → notify-service 站内信
      NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      # 合同审批流接入（BPM M1）：开关默认关闭，行为与接入前一致；
      # 开启需同时配 BPM_INTERNAL_TOKEN（与 bpm-service 同值）
      BPM_ENABLE: ${BPM_ENABLE:-false}
      BPM_API_BASE: ${BPM_API_BASE:-http://go-admin-kit-bpm:8096}
      BPM_INTERNAL_TOKEN: ${BPM_INTERNAL_TOKEN:-}
      BPM_CONTRACT_FLOW_KEY: ${BPM_CONTRACT_FLOW_KEY:-crm_contract_approval}
      # 回款审批（BPM M2）使用的流程定义 key
      BPM_PAYMENT_FLOW_KEY: ${BPM_PAYMENT_FLOW_KEY:-crm_payment_approval}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${CRM_SERVICE_PORT:-8091}:8091"
    labels:
      traefik.enable: "true"
      # 全部接口挂 ForwardAuth（无免鉴权入口）；health 单独放行
      traefik.http.routers.crm.rule: "PathPrefix(`/api/v1/crm`)"
      traefik.http.routers.crm.entrypoints: web,websecure
      traefik.http.routers.crm.priority: "100"
      traefik.http.routers.crm.middlewares: auth-chain
      traefik.http.routers.crm-open.rule: "PathPrefix(`/api/v1/crm/health`)"
      traefik.http.routers.crm-open.entrypoints: web,websecure
      traefik.http.routers.crm-open.priority: "110"
      traefik.http.services.crm.loadbalancer.server.port: "8091"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/api/v1/crm/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - go-admin-kit-net

  visibility-service:
    profiles:
      - compose-fallback
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: visibility
    image: ${IMAGE_PREFIX:-go-admin-kit}-visibility-service:${IMAGE_TAG:-latest}
    container_name: go-admin-kit-visibility
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8093
      DB_HOST: go-admin-kit-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${POSTGRES_DB:-go_admin_kit}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # 排名采集平台：bing/baidu/google/sogou/so360/duckduckgo/github
      SERP_ENGINES: ${SERP_ENGINES:-bing,baidu,google,sogou,so360,github}
      # GEO 提及检测每周自动跑（默认周一 04:43；GEO_CRON_ENABLED=false 关闭）
      GEO_CRON: ${GEO_CRON:-43 4 * * 1}
      # 检测完成 → notify-service 站内信（与其余服务同默认 token 对齐）
      NOTIFY_API_BASE: ${NOTIFY_API_BASE:-http://go-admin-kit-notify:8095}
      NOTIFY_INTERNAL_TOKEN: ${NOTIFY_INTERNAL_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${SERVICES_BIND_IP:-127.0.0.1}:${VISIBILITY_SERVICE_PORT:-8093}:8093"
    labels:
      traefik.enable: "true"
      traefik.http.routers.visibility.rule: "PathPrefix(`/api/v1/visibility`)"
      traefik.http.routers.visibility.entrypoints: web,websecure
      traefik.http.routers.visibility.priority: "100"
      traefik.http.routers.visibility.middlewares: auth-chain
      traefik.http.routers.visibility-open.rule: "PathPrefix(`/api/v1/visibility/health`)"
      traefik.http.routers.visibility-open.entrypoints: web,websecure
      traefik.http.routers.visibility-open.priority: "110"
      traefik.http.services.visibility.loadbalancer.server.port: "8093"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/api/v1/visibility/health/live >/dev/null || exit 1"]
